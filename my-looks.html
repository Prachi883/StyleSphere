<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Looks · StyleSphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

    <!-- shared navbar, fonts, chips and look-card styles -->
    <link rel="stylesheet" href="css/style-matcher.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="index.html" class="logo">StyleSphere</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="wardrobe.html">My Wardrobe</a>
            <a href="style-matcher.html">Style Matcher</a>
            <a href="style-studio.html">Style Studio</a>
            <a href="my-looks.html" class="active">My Looks</a>
        </nav>

        <div class="nav-actions">
            <a href="my-looks.html" class="icon-btn" aria-label="My saved looks">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
                <span class="badge" id="savedCount" hidden>0</span>
            </a>
            <div class="avatar" aria-label="Profile">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
            </div>
            <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
        </div>
    </header>

    <main class="looks-page">

        <!-- HEADER -->
        <section class="looks-header">
            <p class="eyebrow center">MY LOOKS</p>
            <h1>Your saved <em>looks</em></h1>
            <p class="lead center" id="looksSubtitle">Every outfit you love, kept in one place.</p>

            <div class="chips filter-chips" id="filterChips"></div>
        </section>

        <!-- SAVED LOOKS -->
        <section class="looks-grid-section">
            <div class="cards saved-cards" id="savedCards"></div>

            <!-- shown when nothing is saved -->
            <div class="empty-state" id="emptyState" hidden>
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
                </div>
                <p class="script-heading">nothing here yet</p>
                <p class="empty-text">Find an outfit you love in the Style Matcher and tap <strong>Save Look</strong> — it will appear here.</p>
                <a href="style-matcher.html" class="cta cta-link">Find My Outfit <span class="arrow">→</span></a>
            </div>

            <div class="clear-wrap" id="clearWrap" hidden>
                <button type="button" class="text-btn" id="clearAllBtn">Clear all saved looks</button>
            </div>
        </section>
    </main>

    <script src="js/recommendation-engine.js"></script>
    <script src="js/saved-looks.js"></script>
    <script src="js/my-looks.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
